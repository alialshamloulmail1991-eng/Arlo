<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arlo - Krono</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-midnight">
  <div id="app" class="app-root">
    
    <!-- شاشة تسجيل الدخول وإنشاء الحساب -->
    <section id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-logo">A</div>
          <h1>Arlo</h1>
          <p>تواصل مع العالم بأسلوبك</p>
        </div>

        <div class="auth-tabs">
          <button id="loginTabBtn" class="tab-btn active" onclick="switchAuthTab('login')">تسجيل الدخول</button>
          <button id="registerTabBtn" class="tab-btn" onclick="switchAuthTab('register')">حساب جديد</button>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
          <div class="input-group">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input type="email" id="loginEmail" required placeholder="name@example.com">
          </div>
          <div class="input-group">
            <label for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
          </div>
          <button type="submit" class="primary-btn full-width" id="loginSubmitBtn">دخول</button>
        </form>

        <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="input-group">
            <label for="regName">الاسم الكامل</label>
            <input type="text" id="regName" required placeholder="علي الشملول">
          </div>
          <div class="input-group">
            <label for="regUsername">اسم المستخدم</label>
            <input type="text" id="regUsername" required placeholder="ali3li">
          </div>
          <div class="input-group">
            <label for="regEmail">البريد الإلكتروني</label>
            <input type="email" id="regEmail" required placeholder="name@example.com">
          </div>
          <div class="input-group">
            <label for="regPassword">كلمة المرور</label>
            <input type="password" id="regPassword" required placeholder="••••••••">
          </div>
          <button type="submit" class="primary-btn full-width" id="regSubmitBtn">إنشاء الحساب</button>
        </form>

        <div id="authError" class="auth-error hidden"></div>
      </div>
    </section>

    <!-- واجهة التطبيق الرئيسية -->
    <section id="mainApp" class="main-app hidden">
      <!-- الشريط العلوي -->
      <header class="app-header">
        <div class="header-left">
          <div class="logo-text">Arlo</div>
        </div>
        <div class="header-right">
          <button class="icon-button" onclick="openSearchModal()">🔍</button>
          <button class="icon-button" onclick="switchTab('notifications')">
            🔔
            <span id="unreadNotifBadge" class="badge hidden">0</span>
          </button>
          <button class="icon-button" onclick="switchTab('chats')">
            💬
            <span id="unreadChatBadge" class="badge hidden">0</span>
          </button>
        </div>
      </header>

      <!-- محتوى الصفحات -->
      <main class="app-body">
        
        <!-- 1. الرئيسية / Feed -->
        <section id="tab-feed" class="tab-page active">
          <div class="create-post-card">
            <div class="avatar" id="feedUserAvatar"></div>
            <input type="text" readonly placeholder="بم تفكر اليوم؟" onclick="openCreatePostModal()">
            <button class="icon-button" onclick="openCreatePostModal()">📷</button>
          </div>
          <div id="postsFeed" class="posts-feed"></div>
        </section>

        <!-- 2. المحادثات / Chats -->
        <section id="tab-chats" class="tab-page hidden">
          <div class="chats-container">
            <div class="chats-sidebar" id="chatsList">
              <!-- يتم ملؤها بالديناميكية -->
            </div>
            
            <section id="chatPanel" class="chat-panel hidden">
              <div class="chat-title">
                <button class="chat-back-btn icon-button" onclick="closeChat()">←</button>
                <div class="avatar" id="chatAvatar"></div>
                <div>
                  <strong id="chatName">المحادثة</strong>
                  <small id="chatStatus" class="muted">متصل</small>
                </div>
                <button class="icon-button" onclick="openChatInfo()">ℹ️</button>
              </div>
              <div id="messagesList" class="messages-list"></div>
              <div class="chat-input-bar">
                <button class="icon-button" onclick="toggleAttachMenu()">📎</button>
                <button class="icon-button" onclick="toggleEmojiPanel()">😊</button>
                <input id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
                <button id="voiceMessageBtn" class="icon-button" onclick="toggleVoiceMessage()">🎙️</button>
                <button class="primary-btn" id="sendMessageBtn" onclick="sendMessage()">إرسال</button>
              </div>
              <div id="chatEmojiPanel" class="emoji-panel hidden"></div>
              <div id="chatAttachMenu" class="attach-menu hidden">
                <button onclick="pickChatAttachment('image')">🖼️ صورة</button>
                <button onclick="pickChatAttachment('video')">🎥 فيديو</button>
                <button onclick="pickChatAttachment('file')">📁 ملف</button>
              </div>
              <input id="chatImageInput" type="file" accept="image/*" hidden onchange="attachChatFile(this)">
              <input id="chatVideoInput" type="file" accept="video/*" hidden onchange="attachChatFile(this)">
              <input id="chatFileInput" type="file" hidden onchange="attachChatFile(this)">
            </section>
          </div>
        </section>

        <!-- 3. الإشعارات / Notifications -->
        <section id="tab-notifications" class="tab-page hidden">
          <div id="notificationsList" class="notifications-list"></div>
        </section>

        <!-- 4. الملف الشخصي / Profile -->
        <section id="tab-profile" class="tab-page hidden">
          <div class="profile-header-card">
            <div class="cover-image" id="profileCover"></div>
            <div class="profile-info-bar">
              <div class="avatar large" id="profileAvatar"></div>
              <div class="profile-titles">
                <h2 id="profileName">--</h2>
                <span id="profileHandle" class="muted">@--</span>
              </div>
              <button id="editProfileBtn" class="secondary-btn" onclick="openEditProfileModal()">تعديل الملف</button>
            </div>
            <p id="profileBio" class="profile-bio"></p>
            <div class="profile-stats">
              <div><strong id="statPosts">0</strong><span>منشورات</span></div>
              <div><strong id="statFollowers">0</strong><span>متابعين</span></div>
              <div><strong id="statFollowing">0</strong><span>يتابع</span></div>
            </div>
          </div>
          <div id="userPostsFeed" class="posts-feed"></div>
        </section>

        <!-- 5. الإعدادات / Settings -->
        <section id="tab-settings" class="tab-page hidden">
          <div class="settings-list">
            <h3>الإعدادات والحساب</h3>
            <div class="setting-item" onclick="toggleTheme()">
              <span>الظلمة والنمط (Theme)</span>
              <span id="themeLabel">Midnight</span>
            </div>
            <div class="setting-item" onclick="openAccountSettings()">
              <span>إدارة الحساب والأمان</span>
              <span>></span>
            </div>
            <div class="setting-item danger" onclick="logout()">
              <span>تسجيل الخروج</span>
              <span>🚪</span>
            </div>
            <div class="setting-item danger-fill" onclick="deleteOwnAccount()">
              <span>حذف الحساب نهائياً</span>
              <span>⚠️</span>
            </div>
          </div>
        </section>

      </main>

      <!-- الشريط السفلي للرجوع/التنقل -->
      <nav class="app-nav">
        <button class="nav-btn active" onclick="switchTab('feed')">🏠 <span>الرئيسية</span></button>
        <button class="nav-btn" onclick="switchTab('chats')">💬 <span>الرسائل</span></button>
        <button class="nav-btn" onclick="openCreatePostModal()">➕ <span>نشر</span></button>
        <button class="nav-btn" onclick="switchTab('notifications')">🔔 <span>الإشعارات</span></button>
        <button class="nav-btn" onclick="switchTab('profile')">👤 <span>حسابي</span></button>
      </nav>

    </section>

    <!-- المودالات / Popups -->
    <div id="modalOverlay" class="modal-overlay hidden">
      
      <!-- مودال إنشاء منشور -->
      <div id="createPostModal" class="modal-card hidden">
        <div class="modal-header">
          <h3>إنشاء منشور جديد</h3>
          <button class="icon-button" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <textarea id="postContentInput" placeholder="اكتب شيئاً..."></textarea>
          <div id="postMediaPreview" class="media-preview hidden"></div>
        </div>
        <div class="modal-footer">
          <input type="file" id="postMediaInput" hidden onchange="handlePostMediaSelect(this)">
          <button class="icon-button" onclick="document.getElementById('postMediaInput').click()">🖼️ إضافة صورة/فيديو</button>
          <button class="primary-btn" id="publishPostBtn" onclick="publishPost()">نشر</button>
        </div>
      </div>

      <!-- مودال البحث -->
      <div id="searchModal" class="modal-card hidden">
        <div class="modal-header">
          <input type="text" id="searchInput" placeholder="ابحث عن مستخدمين..." oninput="handleSearch(this.value)">
          <button class="icon-button" onclick="closeModal()">✕</button>
        </div>
        <div id="searchResults" class="search-results-list"></div>
      </div>

    </div>

  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
